name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'bambu2ad5x.py'
      - 'ad5x_template.json'
      - 'LICENSE'
      - 'tests/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'bambu2ad5x.py'
      - 'ad5x_template.json'
      - 'LICENSE'
      - 'tests/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Check Android SDK
        run: |
          sdkmanager --version
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Prepare shared conversion engine
        run: python3 android/prepare_engine.py
      - name: Run converter regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/3MF-to-AD5X-Android-debug.apk
          (cd dist && sha256sum 3MF-to-AD5X-Android-debug.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: 3MF-to-AD5X-Android-ARM64
          path: dist/
          if-no-files-found: error
          retention-days: 30
