plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.chaquo.python'
}
android {
    namespace 'org.ad5x.converter'
    compileSdk 35
    defaultConfig {
        applicationId 'org.ad5x.converter'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0-alpha'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildFeatures { compose true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
chaquopy {
    defaultConfig { version = '3.11' }
}
dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
}
tasks.named('preBuild').configure {
    doFirst {
        if (!file('src/main/python/bambu2ad5x.py').isFile() || !file('src/main/assets/ad5x_template.json').isFile()) {
            throw new GradleException('Run python3 prepare_engine.py in android/ before building.')
        }
    }
}
